<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Verificador de Documentos INASEP</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --g9: #0d1f14; --g8: #142a1b; --g7: #1e3d28; --g5: #3d7a4e; --g4: #4a8c5c;
  --gold: #b8934a;
  --ink: #1a2e1e; --muted: #5f776a; --line: #dfe9e2; --bg: #eef3ef;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(ellipse at 15% 0%, rgba(74,140,92,.16), transparent 55%);
  color: var(--ink);
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  line-height: 1.55;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 14px;
}
.sheet {
  width: 100%;
  max-width: 720px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 18px 48px rgba(13,31,20,.12);
  overflow: hidden;
}
.head {
  background: linear-gradient(135deg, var(--g9), var(--g7));
  color: #fff;
  padding: 26px 24px 22px;
  text-align: center;
  border-bottom: 4px solid var(--gold);
}
.brand {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: .2em;
  padding-left: .2em;
}
.sub {
  margin-top: 6px;
  font-size: .78rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .8;
}
.body { padding: 28px; }

.status {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 16px 18px;
  border-radius: 12px;
  border: 1px solid;
  margin-bottom: 26px;
}
.status svg { flex-shrink: 0; width: 36px; height: 36px; }
.status h2 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
.status p { margin: 3px 0 0; font-size: .88rem; }
.status.ok   { background: #eef8f1; border-color: #bfe3cb; color: #17653a; }
.status.bad  { background: #fdf0ee; border-color: #f2c4bd; color: #9b2335; }
.status.warn { background: #fff7ea; border-color: #f1d9a8; color: #8a5a0b; }

.student { text-align: center; margin: 4px 0 26px; }
.tag {
  font-size: .75rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 700;
}
.name {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.75rem;
  line-height: 1.25;
  color: var(--g8);
  margin: 8px 0 4px;
  overflow-wrap: break-word;
}
.rut { color: var(--muted); font-size: .95rem; }

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.cell { background: #fff; padding: 14px 16px; min-width: 0; }
.cell.full { grid-column: 1 / -1; }
.label {
  font-size: .72rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 3px;
}
.value {
  font-size: 1rem;
  color: var(--ink);
  font-weight: 500;
  overflow-wrap: break-word;
}
.code-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.code {
  font-family: 'DM Mono', Consolas, 'Courier New', monospace;
  font-size: .9rem;
  background: #f1f7f3;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 9px;
  overflow-wrap: anywhere;
}
.btn {
  font-family: inherit;
  font-size: .8rem;
  font-weight: 600;
  color: var(--g5);
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 7px 14px;
  cursor: pointer;
}
.btn:hover { border-color: var(--g4); color: var(--g7); }

.note {
  margin: 22px 0 0;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: .85rem;
  color: var(--muted);
  text-align: center;
}
.actions { text-align: center; margin-top: 16px; }
.foot {
  background: #f6faf7;
  border-top: 1px solid var(--line);
  padding: 16px 24px;
  text-align: center;
  font-size: .78rem;
  color: var(--muted);
}
.foot strong { color: var(--g7); }

.center { text-align: center; padding: 12px 0 8px; }
.center svg { width: 54px; height: 54px; margin-bottom: 10px; }
.center h2 { margin: 0 0 8px; font-size: 1.2rem; }
.center p { margin: 0 auto; max-width: 460px; color: var(--muted); font-size: .95rem; }
.center.bad h2 { color: #9b2335; }
.center.warn h2 { color: #8a5a0b; }

.spinner {
  border: 4px solid #e0e8e0;
  border-top-color: var(--g4);
  width: 38px; height: 38px;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 18px auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 560px) {
  body { padding: 12px 8px; align-items: flex-start; }
  .body { padding: 20px 16px; }
  .grid { grid-template-columns: 1fr; }
  .name { font-size: 1.45rem; }
  .brand { font-size: 1.6rem; }
}
@media print {
  body { background: #fff; padding: 0; display: block; }
  .sheet { box-shadow: none; border: 1px solid #999; }
  .actions, .btn { display: none !important; }
  .head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<main class="sheet" id="verificationCard">
  <header class="head">
    <div class="brand">INASEP</div>
    <div class="sub">Verificador Oficial de Documentos</div>
  </header>
  <section class="body" id="contentArea" aria-live="polite">
    <div class="center">
      <div class="spinner"></div>
      <p>Verificando documento...</p>
    </div>
  </section>
  <footer class="foot">
    Documento emitido por el <strong>Instituto Nacional de Seguridad Privada</strong><br>
    Sistema de verificación en línea
  </footer>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDnzXP59rK49bmKbDeYX8oUtobVaKyI2A4",
  authDomain: "mi-lms-563bf.firebaseapp.com",
  projectId: "mi-lms-563bf",
  storageBucket: "mi-lms-563bf.firebasestorage.app",
  messagingSenderId: "303910884065",
  appId: "1:303910884065:web:5f2fe854e17fd25ed21da0"
};

try { firebase.initializeApp(firebaseConfig); } catch (e) { /* ya inicializado */ }
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const tokenId = params.get('id');

const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16.2 9.5"/></svg>';
const ICON_BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.01"/></svg>';

function escapeHtml(str) {
  if (str === null || str === undefined || str === '') return '';
  return str.toString().replace(/[&<>"']/g, function (m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    return '&#039;';
  });
}

function toDate(v) {
  if (!v) return null;
  try {
    let d;
    if (v.toDate) d = v.toDate();
    else if (v.seconds) d = new Date(v.seconds * 1000);
    else d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
  } catch (e) { return null; }
}
function fmtLong(d) {
  return d.toLocaleDateString('es-CL', { day: '2-digit', month: 'long', year: 'numeric' });
}

function showMessage(kind, icon, title, text) {
  document.getElementById('contentArea').innerHTML =
    '<div class="center ' + kind + '">' + icon + '<h2>' + escapeHtml(title) + '</h2><p>' + text + '</p></div>';
}

// Reparte las celdas en 2 columnas sin dejar huecos vacíos
function layoutCells(cells) {
  let pending = null;
  cells.forEach(c => {
    if (c.full) { if (pending) { pending.full = true; pending = null; } }
    else if (pending) { pending = null; }
    else { pending = c; }
  });
  if (pending) pending.full = true;
  return cells;
}

window.addEventListener('load', async () => {
  const TOKEN_RE = /^[A-Za-z0-9_]{4,40}$/;
  if (!tokenId || !TOKEN_RE.test(tokenId)) {
    showMessage('bad', ICON_BAD, 'Código inválido',
      'El código de verificación no tiene un formato válido.<br>Escanea nuevamente el código QR del documento original.');
    return;
  }

  try {
    const docSnap = await db.collection('diplomas').doc(tokenId).get();

    if (!docSnap.exists) {
      showMessage('warn', ICON_WARN, 'Documento no encontrado',
        'Este certificado o diploma no está registrado en nuestros sistemas.<br>Verifica que el código sea correcto o contacta al Instituto INASEP.');
      return;
    }

    const data = docSnap.data();
    const esDiploma = data.type === 'diploma';
    const docType = esDiploma ? 'Diploma de Honor' : 'Certificado de Aprobación';

    const dEmision = toDate(data.issuedAt);
    const fechaEmision = dEmision ? fmtLong(dEmision) : 'No disponible';

    // Término del curso (documentos nuevos) o mes de realización
    let cursoLabel = '', cursoValor = '';
    const dCurso = toDate(data.courseDate);
    if (dCurso) { cursoLabel = 'Término del curso'; cursoValor = fmtLong(dCurso); }
    else if (data.courseMonth) {
      const pm = String(data.courseMonth).split('-');
      const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      if (meses[Number(pm[1]) - 1]) {
        cursoLabel = 'Mes de realización';
        cursoValor = meses[Number(pm[1]) - 1] + ' de ' + pm[0];
      }
    }

    const modalidades = { presencial: 'Presencial', online: 'Online (plataforma INASEP)' };
    const tienePuntaje = data.percentage !== null && data.percentage !== undefined && data.percentage !== '';
    const puntaje = tienePuntaje
      ? String(data.percentage) + '%' + (data.score ? ' (' + String(data.score) + ')' : '')
      : 'Aprobado';

    const cells = [
      { l: 'Curso', v: escapeHtml(data.courseName) || 'No especificado', full: true }
    ];
    if (modalidades[data.modality]) cells.push({ l: 'Modalidad', v: escapeHtml(modalidades[data.modality]) });
    cells.push({ l: tienePuntaje ? 'Puntaje' : 'Resultado', v: escapeHtml(puntaje) });
    cells.push({ l: 'Carga horaria', v: data.hours ? escapeHtml(String(data.hours)) + ' horas' : 'No especificada' });
    if (cursoLabel) cells.push({ l: cursoLabel, v: escapeHtml(cursoValor) });
    cells.push({ l: 'Fecha de emisión', v: escapeHtml(fechaEmision) });
    layoutCells(cells);
    cells.push({
      l: 'Código de verificación', full: true,
      v: '<div class="code-row"><span class="code" id="codeText">' + escapeHtml(tokenId) + '</span>' +
         '<button class="btn" id="copyBtn" type="button">Copiar código</button></div>'
    });

    // Estado: vigente o anulado (campo opcional, los documentos antiguos no lo tienen)
    let statusHtml;
    if (data.revoked === true) {
      const dRev = toDate(data.revokedAt);
      statusHtml = '<div class="status bad" role="status">' + ICON_BAD +
        '<div><h2>Documento anulado</h2><p>Este documento fue anulado por INASEP y ya no es válido.' +
        (dRev ? ' Anulado el ' + escapeHtml(fmtLong(dRev)) + '.' : '') +
        (data.revokedReason ? ' Motivo: ' + escapeHtml(data.revokedReason) + '.' : '') +
        '</p></div></div>';
    } else {
      statusHtml = '<div class="status ok" role="status">' + ICON_OK +
        '<div><h2>Documento auténtico y vigente</h2><p>Registrado oficialmente en los sistemas de INASEP.</p></div></div>';
    }

    const ahora = new Date().toLocaleString('es-CL', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    document.getElementById('contentArea').innerHTML =
      statusHtml +
      '<div class="student">' +
        '<div class="tag">' + escapeHtml(docType) + '</div>' +
        '<div class="name">' + (escapeHtml(data.studentName) || 'Sin nombre') + '</div>' +
        '<div class="rut">RUT: ' + (escapeHtml(data.studentRut) || 'No especificado') + '</div>' +
      '</div>' +
      '<div class="grid">' + cells.map(c =>
        '<div class="cell' + (c.full ? ' full' : '') + '"><div class="label">' + c.l +
        '</div><div class="value">' + c.v + '</div></div>').join('') + '</div>' +
      '<p class="note">Consulta realizada el ' + escapeHtml(ahora) + '.<br>' +
      'La autenticidad de este documento se confirma únicamente mediante este portal oficial.</p>' +
      '<div class="actions"><button class="btn" type="button" onclick="window.print()">Imprimir constancia</button></div>';

    const copyBtn = document.getElementById('copyBtn');
    if (copyBtn) copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(tokenId); copyBtn.textContent = 'Copiado ✓'; }
      catch (e) {
        const r = document.createRange(); r.selectNodeContents(document.getElementById('codeText'));
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        copyBtn.textContent = 'Seleccionado';
      }
      setTimeout(() => { copyBtn.textContent = 'Copiar código'; }, 2000);
    });
  } catch (error) {
    console.error('Error al verificar:', error);
    showMessage('warn', ICON_WARN, 'No se pudo verificar',
      'No fue posible consultar el documento en este momento.<br>Por favor intenta nuevamente en unos minutos.');
  }
});
</script>
</body>
</html>
